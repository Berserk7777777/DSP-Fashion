[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-psp"
version = "0.1.0"
description = "Backbone-agnostic progressive seed pruning for generative fashion recommendation"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
include = ["fashion_psp*"]

[tool.ruff]
line-length = 100
target-version = "py310"
